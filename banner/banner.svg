<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#131a2e"/>
      <stop offset="100%" stop-color="#1b1640"/>
    </linearGradient>
    <linearGradient id="mark" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="55%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="340" fill="url(#bg)"/>

  <!-- Faint PCB routing, so the banner reads as hardware without shouting. -->
  <g fill="none" stroke="#6366f1" stroke-opacity="0.16" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 268 H150 l34 -34 H360"/>
    <path d="M0 300 H206 l34 -34 H470"/>
    <path d="M1280 66 H1120 l-34 34 H900"/>
    <path d="M1280 104 H1062 l-34 34 H840"/>
  </g>
  <g fill="#6366f1" fill-opacity="0.3">
    <circle cx="360" cy="234" r="5"/><circle cx="470" cy="266" r="5"/>
    <circle cx="900" cy="100" r="5"/><circle cx="840" cy="138" r="5"/>
  </g>

  <!-- Hexagon die mark, same identity as the portfolio favicon. -->
  <g transform="translate(96 108) scale(1.02)">
    <polygon points="110,60 85,103 35,103 10,60 35,17 85,17"
             fill="url(#mark)" stroke="url(#mark)" stroke-width="13" stroke-linejoin="round"/>
    <g transform="translate(-4 0)">
      <g fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M46 36 V84"/>
        <path d="M46 36 H62 a11 11 0 0 1 0 22 H46"/>
        <path d="M46 58 H67 a13 13 0 0 1 0 26 H46"/>
      </g>
      <g fill="#ffffff"><circle cx="46" cy="36" r="7"/><circle cx="46" cy="84" r="7"/></g>
      <g fill="url(#mark)"><circle cx="46" cy="36" r="2.8"/><circle cx="46" cy="84" r="2.8"/></g>
    </g>
  </g>

  <text x="268" y="150" font-family="Inter, 'Segoe UI', Arial, sans-serif"
        font-size="58" font-weight="700" fill="#f1f5f9" letter-spacing="-1">Trần Duy Bảo</text>
  <text x="270" y="196" font-family="Inter, 'Segoe UI', Arial, sans-serif"
        font-size="26" font-weight="600" fill="#8b9bfb">Embedded &amp; AI Engineer</text>
  <text x="270" y="238" font-family="Inter, 'Segoe UI', Arial, sans-serif"
        font-size="18" fill="#7c879e">BLE hardware  ·  LLM fine-tuning  ·  Full-stack  ·  Ho Chi Minh City</text>
</svg>
